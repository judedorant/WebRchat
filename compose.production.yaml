# Production template: terminate TLS at a trusted ingress before using this stack.
name: webrchat-production
x-app: &app
  image: ${BACKEND_IMAGE:-webrchat-backend:production}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
  env_file: ./backend/.env
  environment:
    APP_ENV: production
    APP_DEBUG: 'false'
    SESSION_SECURE_COOKIE: 'true'
  volumes:
    - private_storage:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  backend:
    <<: *app
    healthcheck:
      test: [CMD, php, artisan, 'app:health']
      interval: 30s
      timeout: 10s
      retries: 5
  frontend:
    image: ${FRONTEND_IMAGE:-webrchat-frontend:production}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, 'http://127.0.0.1/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - backend
      - reverb
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${APP_PORT:-8080}:80']
    volumes: ['./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [frontend]
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, 'http://127.0.0.1/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webrchat}
      MYSQL_USER: ${MYSQL_USER:-webrchat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a strong password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct strong root password}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  reverb:
    <<: *app
    command: [php, artisan, 'reverb:start', --host=0.0.0.0, --port=8080]
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',8080)?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 5
  queue:
    <<: *app
    command: [php, artisan, 'queue:work', --sleep=1, --tries=3, --timeout=60, --max-time=3600]
    healthcheck:
      test: [CMD, php, artisan, 'queue:monitor', 'redis:default', --max=100]
      interval: 30s
      timeout: 10s
      retries: 5
volumes:
  mysql_data:
  redis_data:
  private_storage:
